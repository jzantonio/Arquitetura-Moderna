# Endereço antigo (GitHub Pages): só redireciona para a plataforma na Netlify.
# A plataforma (pasta site/) é publicada pela Netlify; ver netlify.toml.
name: Redirecionar GitHub Pages para a Netlify
on:
  push:
    branches: [main]
    paths: ['github-pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages
      - id: deployment
        uses: actions/deploy-pages@v4
